image: node:22-alpine

stages: 
    - build

cache:
    paths:
        - ./node-modules

npm-build:
    stage: build
    script:
        - npm install
        - npm run build
    artifacts:
        paths:
            - ./dist
        expire_in: 1 hour
    rules:
        - if: $CI_PIPELINE_SOURCE == "pipeline"
        - if: $CI_PIPELINE_SOURCE == "web"
